[project]
name = "tarea2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NicoleBs554", email = "nicolebianculli10@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
